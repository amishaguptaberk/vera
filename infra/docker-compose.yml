x-vera-env: &vera-env
  VERA_ENV: synthetic
  VERA_DATABASE_URL: postgresql+psycopg://vera:vera@postgres:5432/vera
  VERA_EXECUTION_MODE: ${VERA_EXECUTION_MODE:-replay}
  VERA_DEMO_TZ: ${VERA_DEMO_TZ:-America/Los_Angeles}
  # Secrets / provider settings: pass-through from the shell or ../.env, no values here.
  NVIDIA_API_KEY:
  VERA_SESSION_SECRET:
  VERA_MODEL_ID:
  VERA_BASE_URL:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vera
      POSTGRES_PASSWORD: vera
      POSTGRES_DB: vera
    ports:
      - "54329:5432"
    volumes:
      - vera-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera -d vera"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    command: ["api"]
    env_file:
      - path: ../.env
        required: false
    environment: *vera-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.api
    command: ["worker"]
    env_file:
      - path: ../.env
        required: false
    environment: *vera-env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,psycopg; psycopg.connect(os.environ['VERA_DATABASE_URL'].replace('+psycopg','',1), connect_timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        # Build-time: baked into the Next.js rewrite. Rebuild after changing.
        VERA_API_ORIGIN: ${VERA_API_ORIGIN:-http://api:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  vera-pg:
