[project]
name = "vera"
version = "0.1.0"
description = "Vera: card dispute case workspace backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "elevenlabs>=2.77.0",
    "fastapi>=0.162",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "sqlalchemy>=2.1",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/domain", "services/api"]
include = ["vera_domain*", "vera_api*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/domain:services/api"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
